name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # `build` = check (ktlint + all tests on jvm + js browser + wasmJs
      # browser) + assemble — the webMain metadata compilation is exercised
      # only by `assemble`, so `allTests`-style runs cannot stay the gate.
      # ktlint needs no explicit call: its source-set checks are wired into
      # `check` (decisions log #32). Chrome/Chromium is preinstalled on the
      # ubuntu and windows runner images and drives the Karma ChromeHeadless
      # suites; the macOS image does not document Chrome, so it runs the JVM
      # suite only (decisions log #19).
      - if: matrix.os != 'macos-latest'
        run: ./gradlew build --rerun-tasks --stacktrace
      - if: matrix.os == 'macos-latest'
        run: ./gradlew build --rerun-tasks -x :kge-core:jsBrowserTest -x :kge-core:wasmJsBrowserTest --stacktrace
