name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # The JVM GL smoke test uses the production GLFW path, headless. Linux
      # needs a display (Xvfb) plus Mesa's software driver; Windows gets Mesa
      # from setup-mesa-dist-win; the macOS runner cannot create a GL context,
      # so the probe skips there.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - if: matrix.os == 'windows-latest'
        uses: ssciwr/setup-mesa-dist-win@v3
      # `build` = check (ktlint + all tests on jvm + js browser + wasmJs
      # browser) + assemble — the webMain metadata compilation is exercised
      # only by `assemble`, so `allTests`-style runs cannot stay the gate.
      # ktlint needs no explicit call: its source-set checks are wired into
      # `check` (decisions log #32). All three OSes run the full suite now
      # (the old macOS exclusion rested on an unverified "no Chrome" claim).
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./gradlew build --rerun-tasks --stacktrace
      - if: matrix.os != 'ubuntu-latest'
        run: ./gradlew build --rerun-tasks --stacktrace
