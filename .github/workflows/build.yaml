name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :kge-core:jvmTest :kge-core:jsNodeTest :kge-core:wasmJsNodeTest ktlintCheck --stacktrace
