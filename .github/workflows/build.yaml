name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # `build` = check (all tests, node-only here: no Chrome on the runners)
      # + assemble — the webMain metadata compilation is exercised only by
      # `assemble`, so `allTests`-style node-only runs cannot stay the gate.
      - run: ./gradlew build -x :kge-core:jsBrowserTest -x :kge-core:wasmJsBrowserTest ktlintCheck --stacktrace
