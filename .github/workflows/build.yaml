name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # Chrome for Testing, on every runner. The ubuntu/windows images ship
      # Chrome and the macOS image ships `Google Chrome` too (verified against
      # the macos-26-arm64 image readme), but pinning the channel removes image
      # drift and guarantees the binary is where Karma looks. `CHROME_BIN` is
      # what the KGP Karma ChromeHeadless launcher reads on macOS/Windows.
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
      - name: Point Karma at the pinned Chrome
        shell: bash
        run: echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # The JVM GL smoke test opens a hidden GLFW window. On the ubuntu runner
      # there is no X display, so the build runs through setup-xvfb, which
      # installs xvfb and wraps the command (macOS/Windows just run it).
      # `build` = check (ktlint + all tests on jvm + js browser + wasmJs
      # browser) + assemble — the webMain metadata compilation is exercised
      # only by `assemble`, so `allTests`-style runs cannot stay the gate.
      # ktlint needs no explicit call: its source-set checks are wired into
      # `check` (decisions log #32). All three OSes run the full suite now
      # (decisions log #19's macOS exclusion rested on an unverified "no
      # Chrome" claim).
      - uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew build --rerun-tasks --stacktrace
