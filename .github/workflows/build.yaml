name: Build
on:
  # At the restructure→main merge, switch this trigger to main.
  push: { branches: [restructure] }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: zulu, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      # The JVM GL smoke test uses the production GLFW path headless. Linux
      # needs a display (Xvfb) plus Mesa's software driver; Windows gets Mesa
      # from setup-mesa-dist-win; macOS cannot create a GL context, so it skips.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - if: matrix.os == 'windows-latest'
        uses: ssciwr/setup-mesa-dist-win@v3
      # `buildSrc` is not part of the main build's task graph, so its own tests
      # need a separate invocation before the root build.
      - run: ./gradlew -p buildSrc build --rerun-tasks --stacktrace
      # `build` = check + assemble; only `assemble` exercises the webMain
      # metadata compilation, so `allTests` cannot be the gate. ktlint's
      # source-set checks are wired into `check`.
      - if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a ./gradlew build --rerun-tasks --stacktrace
      - if: matrix.os != 'ubuntu-latest'
        run: ./gradlew build --rerun-tasks --stacktrace
